<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    
    <linearGradient id="luxuryBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140c14" />
      <stop offset="50%" stop-color="#2b0916" />
      <stop offset="100%" stop-color="#580c24" />
    </linearGradient>

    
    <linearGradient id="frostedGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ff4d6d" stop-opacity="0.14" />
    </linearGradient>

    
    <linearGradient id="glassStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55" />
      <stop offset="50%" stop-color="#fda4af" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#fb7185" stop-opacity="0.45" />
    </linearGradient>

    
    <linearGradient id="liquidRuby" x1="20%" y1="5%" x2="85%" y2="95%">
      <stop offset="0%" stop-color="#ff758f" />
      <stop offset="35%" stop-color="#f43f5e" />
      <stop offset="75%" stop-color="#be123c" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>

    
    <radialGradient id="topGlow" cx="35%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#ff4d6d" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#ff4d6d" stop-opacity="0" />
    </radialGradient>

    
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffe4e6" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="100%" stop-color="#fecdd3" stop-opacity="0.9" />
    </linearGradient>

    <filter id="rubyDepth" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#e11d48" flood-opacity="0.5" />
    </filter>
    <filter id="pulseGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ffffff" flood-opacity="0.75" />
    </filter>
  </defs>

  
  <rect x="18" y="18" width="476" height="476" rx="118" fill="url(#luxuryBase)" />
  
  
  <circle cx="256" cy="240" r="210" fill="url(#topGlow)" />

  
  <rect x="64" y="64" width="384" height="384" rx="88" fill="url(#frostedGlass)" stroke="url(#glassStroke)" stroke-width="2.5" />

  
  <path d="M256 104 C256 104 154 220 154 302 C154 360 200 406 256 406 C312 406 358 360 358 302 C358 220 256 104 256 104 Z" fill="url(#liquidRuby)" filter="url(#rubyDepth)" />

  
  <path d="M230 154 C202 194 182 238 182 286 C182 306 188 324 198 338" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity="0.65" />
  <circle cx="212" cy="356" r="5.5" fill="#ffffff" opacity="0.75" />

  
  <polyline points="136,304 196,304 218,266 244,344 270,248 292,318 312,304 376,304" fill="none" stroke="url(#pulseGrad)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" filter="url(#pulseGlow)" />
</svg>